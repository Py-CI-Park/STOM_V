[pytest]
# ==============================================================================
# STOM CLI pytest 설정
# ==============================================================================

# 테스트 경로
testpaths = tests

# Python 파일 패턴
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*

# 마커 정의
markers =
    smoke: 스모크 테스트 (빠른 기본 검증)
    unit: 단위 테스트
    integration: 통합 테스트
    slow: 느린 테스트 (대용량 데이터 등)
    requires_db: 데이터베이스 필요 테스트

# 기본 옵션
addopts =
    -v
    --tb=short
    --strict-markers
    -ra

# 출력 설정
console_output_style = progress

# 경고 필터
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning

# 로그 설정
log_cli = false
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s (%(filename)s:%(lineno)s)
log_cli_date_format = %Y-%m-%d %H:%M:%S

# 타임아웃 (pytest-timeout 플러그인 필요)
# timeout = 300

# 커버리지 설정 (pytest-cov 플러그인 필요)
# [coverage:run]
# source = cli
# branch = True
# omit =
#     tests/*
#     */__pycache__/*
