[pytest]
# V3U 자동 GUI 검증 pytest 설정
# Constraint: tests/v3u/ 외 경로는 본 lane에서 수집하지 않는다.
testpaths = tests/v3u
qt_api = pyqt5
addopts = -ra --strict-markers --tb=short
timeout = 60
timeout_method = thread

markers =
    smoke: 1순위 사용자 검증 자동화 (메인창 기동·탭 전환·아이콘)
    integration: 2·3순위 자동화 (백테 spawn·분석기·DB·거래소)
    unit: 분석기/유틸 단위 검증 (한글 키 정상)
    contract: REST API 정적 계약 (mock 응답)
    slow: 1초 이상 소요되는 케이스
