<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>STOM Research Lab · 전용 분석 페이지</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="styles.css?v=20260603a" />
  <script src="vendor-react.js?v=20260603a"></script>
  <script src="vendor-react-dom.js?v=20260603a"></script>
  <script src="vendor-babel.js?v=20260603a"></script>
</head>
<body>
  <!-- E1(2026-06-11) — Research Lab 전용 풀페이지: /ui/lab.html (북마크 가능).
       메인 대시보드의 라이브 영역 없이 연구 패널만 전체 폭으로 띄운다. -->
  <div id="root">
    <div style="padding:40px;font-family:system-ui,sans-serif;color:#9fb0c0;background:#0c1014;min-height:100vh;">
      Research Lab 로딩 중… (지속 시 Ctrl+Shift+R)
    </div>
  </div>

  <script type="text/babel" src="research-lab.jsx?v=20260611j"></script>
  <script type="text/babel">
    function LabRoot() {
      const [runs, setRuns] = React.useState([]);
      const [runId, setRunId] = React.useState("");
      React.useEffect(() => {
        fetch("/runs", { signal: AbortSignal.timeout(10000) })
          .then(r => (r.ok ? r.json() : null))
          .then(d => {
            const list = ((d && d.runs) || []).slice(0, 40);
            setRuns(list);
            if (list.length) setRunId(prev => prev || list[0].run_id);
          })
          .catch(() => {});
      }, []);
      return (
        <div style={{ padding: "12px 18px", minHeight: "100vh" }}>
          <div style={{ display: "flex", gap: 10, alignItems: "center", marginBottom: 8 }}>
            <b style={{ fontSize: 15 }}>STOM Research Lab</b>
            <select value={runId} onChange={e => setRunId(e.target.value)}
                    style={{ maxWidth: 420 }}>
              {runs.map(r => (
                <option key={r.run_id} value={r.run_id}>
                  {r.run_id + (r.status === "running" ? " 🔄" : "") + (r.label ? " · " + r.label : "")}
                </option>
              ))}
            </select>
            <a href="/ui/" style={{ marginLeft: "auto", color: "#7ab", fontSize: 12 }}>← 메인 대시보드</a>
          </div>
          <ResearchLabPanel baseUrl={window.location.origin} wsStatus="na" runId={runId} />
        </div>
      );
    }
    ReactDOM.createRoot(document.getElementById("root")).render(<LabRoot />);
  </script>
</body>
</html>
