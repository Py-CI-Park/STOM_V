<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>STOM Research Lab · 전용 분석 페이지</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="styles.css?v=20260613a" />
  <script src="vendor-react.js?v=20260603a"></script>
  <script src="vendor-react-dom.js?v=20260603a"></script>
  <script src="vendor-babel.js?v=20260603a"></script>
</head>
<body>
  <!-- Phase1(2026-06-11) — 사이드바(실행 중·결산 요약·run 목록) + 메인 작업영역.
       run 종류 뱃지(G-3)·결정 페이지 링크 포함. -->
  <div id="root">
    <div style="padding:40px;font-family:system-ui,sans-serif;color:#9fb0c0;background:#0c1014;min-height:100vh;">
      Research Lab 로딩 중… (지속 시 Ctrl+Shift+R)
    </div>
  </div>

  <!-- Phase6.1 — 연구실 페이지 크래시 수정: research-lab.jsx 가 참조하는 전역
       (EdgeRatioPanel=analysis.jsx 등)을 로드하지 않아 ReferenceError 로 페이지 전체가
       죽어 있었다. pro.html 과 동일한(검증된) 의존 세트를 동일 순서로 로드한다. -->
  <script type="text/babel" src="connection.jsx?v=20260612h"></script>
  <script type="text/babel" src="chart.jsx?v=20260614b"></script>
  <script type="text/babel" src="analysis.jsx?v=20260603a"></script>
  <script type="text/babel" src="research-lab.jsx?v=20260614a"></script>
  <script type="text/babel" src="backtest-charts.jsx?v=20260614b"></script>
  <script type="text/babel" src="backtest.jsx?v=20260614a"></script>
  <script type="text/babel" src="research-pro.jsx?v=20260613b"></script>
  <script type="text/babel">
    /* G-3 — run 종류 뱃지(접두 휴리스틱). */
    const RUN_KIND = id =>
      id.startsWith("tmap2") ? "격자" :
      id.startsWith("tmap") ? "지도" :
      id.startsWith("wf_") ? "전진" :
      id.includes("placebo") ? "대조" :
      id.includes("oos") ? "OOS" :
      (id.includes("reeval") || id.includes("combo")) ? "재평가" :
      id.includes("multiseed") ? "발굴" : "루프";

    function Sidebar({ runs, runId, setRunId, ops, verdict }) {
      const active = (ops && ops.active) || [];
      return (
        <div style={{ width: 280, flexShrink: 0, paddingRight: 12, overflowY: "auto",
                      maxHeight: "calc(100vh - 24px)",
                      borderRight: "1px solid rgba(255,255,255,0.08)" }}>
          <div className="research-empty">실행 중</div>
          {active.length === 0
            ? <div className="mono" style={{ fontSize: 11 }}>없음</div>
            : active.map(a => (
              <div key={a.run_id} className="mono" style={{ fontSize: 11, marginBottom: 4 }}>
                🔄 {a.run_id}
                <div style={{ opacity: 0.65 }}>
                  {a.gens}세대 · {a.health === "active" ? "진행 중" : "⚠️ 정체 의심"}
                </div>
              </div>
            ))}
          {ops && ops.batch_queue && (
            <div className="mono" style={{ fontSize: 10.5, opacity: 0.7, marginTop: 2 }}>
              큐: {ops.batch_queue.stages_done}단계 완료 · {ops.batch_queue.current_template || "—"}
            </div>
          )}

          {verdict && (verdict.lines || []).length > 0 && (
            <div style={{ marginTop: 10 }}>
              <div className="research-empty">
                검증 결산 요약{(verdict.alerts || []).length ? ` · ⚠️${verdict.alerts.length}` : ""}
              </div>
              {verdict.lines.slice(0, 2).map((l, i) => (
                <div key={i} className="mono" style={{ fontSize: 10.5, opacity: 0.85 }}>{l}</div>
              ))}
            </div>
          )}

          <div className="research-empty" style={{ marginTop: 10 }}>run 목록 (최신순)</div>
          {runs.map(r => (
            <div key={r.run_id} onClick={() => setRunId(r.run_id)} className="mono"
                 style={{ fontSize: 11, padding: "3px 5px", cursor: "pointer", borderRadius: 4,
                          background: r.run_id === runId ? "rgba(90,140,200,0.25)" : "transparent" }}>
              <span style={{ opacity: 0.55 }}>[{RUN_KIND(r.run_id)}]</span>
              {r.status === "running" ? " 🔄 " : " "}{r.run_id}
              {r.label ? <div style={{ opacity: 0.5, fontSize: 10 }}>{r.label}</div> : null}
            </div>
          ))}
        </div>
      );
    }

    function LabRoot() {
      const [runs, setRuns] = React.useState([]);
      const [runId, setRunId] = React.useState("");
      const [ops, setOps] = React.useState(null);
      const [verdict, setVerdict] = React.useState(null);
      React.useEffect(() => {
        fetch("/runs", { signal: AbortSignal.timeout(10000) })
          .then(r => (r.ok ? r.json() : null))
          .then(d => {
            const list = ((d && d.runs) || []).slice(0, 40);
            setRuns(list);
            if (list.length) setRunId(prev => prev || list[0].run_id);
          }).catch(() => {});
        fetch("/freeze_verdict", { signal: AbortSignal.timeout(12000) })
          .then(r => (r.ok ? r.json() : null)).then(j => setVerdict(j)).catch(() => {});
        const pull = () => fetch("/ops_status", { signal: AbortSignal.timeout(8000) })
          .then(r => (r.ok ? r.json() : null)).then(j => setOps(j)).catch(() => {});
        pull();
        const timer = setInterval(pull, 10000);
        return () => clearInterval(timer);
      }, []);
      return (
        <div style={{ display: "flex", gap: 14, padding: "12px 16px", minHeight: "100vh" }}>
          <Sidebar runs={runs} runId={runId} setRunId={setRunId} ops={ops} verdict={verdict} />
          <div style={{ flex: 1, minWidth: 0 }}>
            <div style={{ display: "flex", alignItems: "center", marginBottom: 6 }}>
              <b style={{ fontSize: 15 }}>STOM Research Lab</b>
              <span className="mono" style={{ marginLeft: 10, fontSize: 11, opacity: 0.7 }}>{runId}</span>
              <a href="/ui/" style={{ marginLeft: "auto", color: "#7ab", fontSize: 12 }}>운영</a>
              <a href="/ui/verdict.html" style={{ marginLeft: 12, color: "#7ab", fontSize: 12 }}>결정</a>
            </div>
            <ResearchLabPanel baseUrl={window.location.origin} wsStatus="na" runId={runId} />
          </div>
        </div>
      );
    }
    ReactDOM.createRoot(document.getElementById("root")).render(<LabRoot />);
  </script>
</body>
</html>
