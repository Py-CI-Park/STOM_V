<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>STOM Research Lab · 전용 분석 페이지</title>


  <link rel="stylesheet" href="/ui/styles.css?v=20260624u002" />
  <script src="/ui/vendor-react.js?v=20260603a"></script>
  <script src="/ui/vendor-react-dom.js?v=20260603a"></script>
  <!-- Phase14.7: 런타임 babel 제거. 운영 컴포넌트는 index.html 과 동일한 컴파일 번들(bundle/app.js)
       을 공유한다(LabPage 포함 전 컴포넌트 정의). 이 페이지는 App 자동 마운트를 끄고(아래 플래그)
       직접 LabPage 를 마운트한다. stom-ui.js(모듈)가 window.fmt*·_axisTicks 를 먼저 세팅. -->
  <script type="module" src="/ui/bundle/stom-ui.js?v=f41f5701"></script>
  <script>window.__STOM_NO_AUTO_MOUNT__ = true;</script>
</head>
<body>
  <!-- Phase9(2026-06-13) — SPA 6탭 통합: 연구실 본문은 dashboard-pages.jsx 전역
       window.LabPage 가 담당한다(app.jsx 의 인페이지 탭과 단일 정본). 직접 URL
       (/ui/lab.html)도 같은 전역을 마운트해 로직 중복 없이 동작한다. -->
  <div style="padding:8px 16px 0;font-family:'IBM Plex Sans',system-ui,sans-serif;">
    <a href="/ui/" style="color:#7ab;font-size:12px;">← 운영 대시보드로</a>
  </div>
  <div id="root">
    <div style="padding:40px;font-family:system-ui,sans-serif;color:#9fb0c0;background:#0c1014;min-height:100vh;">
      Research Lab 로딩 중… (지속 시 Ctrl+Shift+R)
    </div>
  </div>

  <!-- 컴파일 번들(defer) — stom-ui 모듈 뒤에 실행. 이후 DOMContentLoaded 에서 LabPage 마운트. -->
  <script defer src="/ui/bundle/app.js?v=f83b4651"></script>
  <script>
    document.addEventListener("DOMContentLoaded", function () {
      ReactDOM.createRoot(document.getElementById("root"))
        .render(React.createElement(window.LabPage, { baseUrl: window.location.origin }));
    });
  </script>
</body>
</html>
